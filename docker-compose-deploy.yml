version: '3.9'

services:
  frontend:
    container_name: ontrack-frontend
    hostname: ontrack-frontend
    image: ghcr.io/robinkiefer2001/ontrack-frontend:latest
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`ontrack.informait.ch`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=le"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"

  backend:
    container_name: ontrack-backend
    image: ghcr.io/robinkiefer2001/ontrack-backend:latest
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`backend.informait.ch`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls.certresolver=le"
      - "traefik.http.services.backend.loadbalancer.server.port=8000"

  postgres:
    image: postgres:latest
    container_name: ontrack-postgres
    restart: always
    environment:
      AUTHENTIK_DB_PASSWORD: ${AUTHENTIK_DB_PASSWORD}
      POSTGRES_USER: pgroot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: defaultdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    networks:
      - web

  authentik-redis:
    image: redis:alpine
    container_name: ontrack-authentik-redis
    restart: always
    networks:
      - web

  authentik:
    image: ghcr.io/goauthentik/server:latest
    container_name: ontrack-authentik
    restart: always
    environment:
      AUTHENTIK_POSTGRESQL__NAME: AuthentikDB
      AUTHENTIK_POSTGRESQL__HOST: ontrack-postgres
      AUTHENTIK_POSTGRESQL__USER: svc_authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_DB_PASSWORD}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_REDIS__HOST: ontrack-authentik-redis
    volumes:
      - authentik_media:/media
      - authentik_templates:/templates
    depends_on:
      - postgres
      - authentik-redis
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.authentik.rule=Host(`auth.informait.ch`)"
      - "traefik.http.routers.authentik.entrypoints=websecure"
      - "traefik.http.routers.authentik.tls.certresolver=le"
      - "traefik.http.services.authentik.loadbalancer.server.port=9000"
    networks:
      - web

  proxy:
    image: traefik:latest
    container_name: ontrack-proxy
    restart: always
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.le.acme.httpchallenge=true"
      - "--certificatesresolvers.le.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.le.acme.email=robin_kiefer@outlook.com"
      - "--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json"
      - "--api.dashboard=true"
    labels:
      - "traefik.enable=true"

      # Dashboard
      - "traefik.http.routers.traefik.rule=Host(`traefik.informait.ch`)"
      - "traefik.http.routers.traefik.entrypoints=websecure"
      - "traefik.http.routers.traefik.tls.certresolver=le"
      - "traefik.http.routers.traefik.service=api@internal"
      - "traefik.http.routers.traefik.middlewares=auth"

      # Basic Auth for Dashboard
      - "traefik.http.middlewares.auth.basicauth.users=admin:${TRAEFIK_AUTH_HASH}"

      # HTTP → HTTPS Redirect
      - "traefik.http.routers.http-catchall.rule=HostRegexp(`{host:.+}`)"
      - "traefik.http.routers.http-catchall.entrypoints=web"
      - "traefik.http.routers.http-catchall.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"

    ports:
      - "80:80"
      - "443:443"
    volumes:
      - traefik_certs:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - web

networks:
  web:
    external: false

volumes:
  postgres_data:
  traefik_certs:
  authentik_media:
  authentik_templates:

