version: '3.9'

services:
  frontend:
    container_name: ontrack-frontend
    hostname: ontrack-frontend
    image: ghcr.io/robinkiefer2001/ontrack-frontend:latest
    ports:
      - "3000:3000"

  backend:
    container_name: ontrack-backend
    image: ghcr.io/robinkiefer2001/ontrack-backend:latest
    ports:
      - "8000:8000"

  postgres:
    image: postgres:latest
    container_name: ontrack-postgres
    restart: always
    environment:
      POSTGRES_USER: ontrack
      POSTGRES_PASSWORD: ontrackpass
      POSTGRES_DB: ontrackdb
    ports:
      - "5432:5432"