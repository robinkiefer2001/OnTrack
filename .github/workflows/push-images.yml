name: Build and Push Docker Images

permissions:
  contents: read
  packages: write

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ontrack-frontend:latest
            ghcr.io/${{ github.repository_owner }}/ontrack-frontend:${{ github.sha }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ontrack-backend:latest
            ghcr.io/${{ github.repository_owner }}/ontrack-backend:${{ github.sha }}

      # Use official Postgres image, or add custom Dockerfile if needed
      - name: Pull and tag postgres image
        run: |
          docker pull postgres:16
          docker tag postgres:16 ghcr.io/${{ github.repository_owner }}/ontrack-postgres:latest
          docker tag postgres:16 ghcr.io/${{ github.repository_owner }}/ontrack-postgres:${{ github.sha }}

      - name: Push postgres image
        run: |
          echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push ghcr.io/${{ github.repository_owner }}/ontrack-postgres:latest
          docker push ghcr.io/${{ github.repository_owner }}/ontrack-postgres:${{ github.sha }}