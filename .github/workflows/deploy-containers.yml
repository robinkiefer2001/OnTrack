name: deploy-containers

on:
  workflow_run:
    workflows: ["build-images"]
    types:
      - completed

permissions:
  contents: read
  packages: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: add ssh key
        run: |
          mkdir -p ./ssh
          echo "${{ secrets.DEPLOYMENT_SSH_KEY }}" > "./ssh/id_rsa"
          chmod 600 "./ssh/id_rsa"

      - name: Create deployment directory
        run: |
          ssh -i "./ssh/id_rsa" -o StrictHostKeyChecking=no \
            "${{ vars.DEPLOYMENT_USER }}"@"${{ vars.DEPLOYMENT_ENDPOINT }}" \
            "mkdir -p ~/var/opt/ontrack"

      - name: copy docker-compose-deploy
        run: |
          scp -o StrictHostKeyChecking=no -i ./ssh/id_rsa \
            docker-compose-deploy.yml \
            "${{ vars.DEPLOYMENT_USER }}"@"${{ vars.DEPLOYMENT_ENDPOINT }}":~/var/opt/ontrack/docker-compose-deploy.yml

      - name: Create postgres init directory
        run: |
          ssh -i "./ssh/id_rsa" -o StrictHostKeyChecking=no \
            "${{ vars.DEPLOYMENT_USER }}"@"${{ vars.DEPLOYMENT_ENDPOINT }}" \
            "mkdir -p ~/var/opt/ontrack/frontend/postgres/init"

      - name: copy postgres init scripts
        run: |
          scp -o StrictHostKeyChecking=no -i ./ssh/id_rsa \
            ./frontend/postgres/init/* \
            "${{ vars.DEPLOYMENT_USER }}"@"${{ vars.DEPLOYMENT_ENDPOINT }}":/home/github-runner/var/opt/ontrack/frontend/postgres/init/

      - name: Set postgres init script password
        env:
          AUTHENTIK_DB_PASSWORD: ${{ secrets.AUTHENTIK_DB_PASSWORD }}
        run: |
          ssh -i "./ssh/id_rsa" -o StrictHostKeyChecking=no \
            "${{ vars.DEPLOYMENT_USER }}"@"${{ vars.DEPLOYMENT_ENDPOINT }}" \
            AUTHENTIK_DB_PASSWORD="$(printf '%s' "$AUTHENTIK_DB_PASSWORD")" '
              set -euo pipefail
              FILE="/home/github-runner/var/opt/ontrack/frontend/postgres/init/backend-postgress.sql"

              # Passwort für sed escapen: \ / & $
              ESCAPED_PASSWORD=$(printf "%s" "$AUTHENTIK_DB_PASSWORD" | sed -e "s/[\\\/&$]/\\\\&/g")

              sed -i "s|__authPASSWORD__|$ESCAPED_PASSWORD|g" "$FILE"
            '
      
      - name: Set postgres init script ontrack password
        env:
          ONTRACK_DB_PASSWORD: ${{ secrets.ONTRACK_DB_PASSWORD }}
        run: |
          ssh -i "./ssh/id_rsa" -o StrictHostKeyChecking=no \
            "${{ vars.DEPLOYMENT_USER }}"@"${{ vars.DEPLOYMENT_ENDPOINT }}" \
            ONTRACK_DB_PASSWORD="$(printf '%s' "$ONTRACK_DB_PASSWORD")" '
              set -euo pipefail
              FILE="/home/github-runner/var/opt/ontrack/frontend/postgres/init/backend-postgress.sql"

              # Passwort für sed escapen: \ / & $
              ESCAPED_PASSWORD=$(printf "%s" "$ONTRACK_DB_PASSWORD" | sed -e "s/[\\\/&$]/\\\\&/g")

              sed -i "s|__ontrackPASSWORD__|$ESCAPED_PASSWORD|g" "$FILE"
            '
            

      - name: docker compose pull
        run: |
          ssh -o StrictHostKeyChecking=no -i ./ssh/id_rsa \
            "${{ vars.DEPLOYMENT_USER }}"@"${{ vars.DEPLOYMENT_ENDPOINT }}" \
            '
            docker compose -f ~/var/opt/ontrack/docker-compose-deploy.yml pull
            docker pull postgres:latest
            '

      - name: Stop old containers (if any)
        run: |
          ssh -o StrictHostKeyChecking=no -i ./ssh/id_rsa \
            "${{ vars.DEPLOYMENT_USER }}"@"${{ vars.DEPLOYMENT_ENDPOINT }}" \
            '
            docker compose -f ~/var/opt/ontrack/docker-compose-deploy.yml down || true
            '

  build_images:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: add ssh key
        run: |
          mkdir -p ./ssh
          echo "${{ secrets.DEPLOYMENT_SSH_KEY }}" > "./ssh/id_rsa"
          chmod 600 "./ssh/id_rsa"

      - name: Start Containers
        env:
          TRAEFIK_AUTH_HASH: ${{ secrets.TRAEFIK_AUTH_HASH }}
          AUTHENTIK_DB_PASSWORD: ${{ secrets.AUTHENTIK_DB_PASSWORD }}
          AUTHENTIK_SECRET_KEY: ${{ secrets.AUTHENTIK_SECRET_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          AUTH_DOMAIN: ${{ vars.AUTH_DOMAIN }}
          AUTHENTIK_INIT_ADMIN_PW: ${{ secrets.AUTHENTIK_INIT_ADMIN_PW }}
        run: |
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=60 -o ServerAliveCountMax=5 -i ./ssh/id_rsa \
            "${{ vars.DEPLOYMENT_USER }}"@"${{ vars.DEPLOYMENT_ENDPOINT }}" \
            "
            export TRAEFIK_AUTH_HASH='${TRAEFIK_AUTH_HASH}'
            export AUTH_DOMAIN='${AUTH_DOMAIN}'
            export AUTHENTIK_DB_PASSWORD='${AUTHENTIK_DB_PASSWORD}'
            export AUTHENTIK_SECRET_KEY='${AUTHENTIK_SECRET_KEY}'
            export POSTGRES_PASSWORD='${POSTGRES_PASSWORD}'
            export AUTHENTIK_INIT_ADMIN_PW='${AUTHENTIK_INIT_ADMIN_PW}'
            docker compose -f ./var/opt/ontrack/docker-compose-deploy.yml up -d
            "