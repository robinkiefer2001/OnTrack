name: Pull & Run Containers (Self-hosted)

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: read

jobs:
  run-containers:
    runs-on: [self-hosted]  
    steps:
      - name: Log in to GHCR
        run: echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull images
        run: |
          docker pull ghcr.io/robinkiefer2001/ontrack-postgres:latest
          docker pull ghcr.io/robinkiefer2001/ontrack-backend:latest
          docker pull ghcr.io/robinkiefer2001/ontrack-frontend:latest

      - name: Stop old containers (if any)
        run: |
          docker rm -f frontend backend postgres || true

      - name: Start postgres
        run: |
          docker run -d --name postgres \
            -e POSTGRES_PASSWORD=postgres \
            -p 5432:5432 \
            ghcr.io/robinkiefer2001/ontrack-postgres:latest

      - name: Start backend
        run: |
          docker run -d --name backend \
            --link postgres:postgres \
            -e DATABASE_URL=postgresql://postgres:postgres@postgres:5432/postgres \
            -p 8000:8000 \
            ghcr.io/robinkiefer2001/ontrack-backend:latest

      - name: Start frontend
        run: |
          docker run -d --name frontend \
            --link backend:backend \
            -e BACKEND_URL=http://backend:8000 \
            -p 5173:5173 \
            ghcr.io/robinkiefer2001/ontrack-frontend:latest
