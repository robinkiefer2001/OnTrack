version: '3.9'
services:
  frontend:
    container_name: ontrack-frontend
    image: ghcr.io/robinkiefer2001/ontrack-frontend:latest
    hostname: ontrack-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    networks:
      ontrack-net:
        ipv4_address: 10.30.1.10
    ports:
      - "3000:3000"
  backend:
    container_name: ontrack-backend
    image: ghcr.io/robinkiefer2001/ontrack-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    networks:
      ontrack-net:
        ipv4_address: 10.30.1.11
    ports:
      - "8000:8000"

networks:
  ontrack-net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.30.1.0/24