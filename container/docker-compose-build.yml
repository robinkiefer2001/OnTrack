version: '3.9'
services:
  frontend:
    container_name: ontrack-frontend
    hostname: ontrack-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    networks:
      ontrack-net:
        ipv4_address: 10.20.0.10
    ports:
      - "3000:3000"
  backend:
    container_name: ontrack-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    networks:
      ontrack-net:
        ipv4_address: 10.20.0.11
    ports:
      - "8000:8000"

networks:
  ontrack-net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.20.0.0/16